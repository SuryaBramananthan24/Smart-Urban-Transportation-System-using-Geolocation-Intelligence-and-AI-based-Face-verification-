<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bus Fare App</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://js.api.here.com/v3/3.1/mapsjs-core.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://js.api.here.com/v3/3.1/mapsjs-service.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://js.api.here.com/v3/3.1/mapsjs-marker.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://js.api.here.com/v3/3.1/mapsjs-mapevents.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://js.api.here.com/v3/3.1/mapsjs-ui.js" type="text/javascript" charset="utf-8"></script>
</head>
<body class="distance-bg">
    <nav class="distance-header">
        <div class="logo">
            <h2><span class="material-icons">login</span> AI-Based Bus Fare Calculation</h2>
        </div>
        <ul class="nav-links">
            <li><a th:href="'/'"><span class="material-icons">home</span> Home</a></li>
            <li><a th:href="'/signup'"><span class="material-icons">person_add</span> Sign Up</a></li>
        </ul>
    </nav>
    <div class="glass-card login-max-width login-container">
        <h2><span class="material-icons">login</span> Login to Your Account</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button id="login-btn" class="modern-btn">Login</button>
        <div class="link">
            <p>Don't have an account?<a th:href="'/signup'">Sign Up</a></p>
        </div>
    </div>
    <script>
        document.getElementById('login-btn').addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                window.location.href = '/fd';
            } else {
                alert(data.message);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fare Calculation - AI Bus Fare Calculation</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="distance-bg">
    <header class="distance-header">
        <div class="navbar">
            <a th:href="'/'"><span class="material-icons">home</span> Home</a>
        </div>
    </header>
    <section class="glass-card">
        <h2><span class="material-icons">attach_money</span> Fare Calculation</h2>
        <form th:action="/fc">
            <label for="start_location"><span class="material-icons">place</span> Start Location:</label>
            <input type="text" id="start_location" name="start_location" required>
            <label for="end_location"><span class="material-icons">flag</span> End Location:</label>
            <input type="text" id="end_location" name="end_location" required>
            <label for="user_type"><span class="material-icons">person</span> User Type:</label>
            <select id="user_type" name="user_type" required>
                <option value="regular">Regular</option>
                <option value="student">Student</option>
                <option value="senior">Senior</option>
            </select>
            <button type="submit" class="modern-btn">Calculate Fare</button>
        </form>
        <p>Estimated Fare: <span id="estimatedFare" class="modern-fare">Not calculated</span></p>
    </section>
</body>
</html>

spring.application.name=aibusfare
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
server.port=8085
payment.upi.id=suryasurya6444@oksbi
payment.upi.name=AI Bus Fare
# H2 Database
spring.datasource.url=jdbc:h2:file:./data/busfare;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (optional, useful for debugging at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

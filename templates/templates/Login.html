<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bus Fare App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://js.api.here.com/v3/3.1/mapsjs-core.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://js.api.here.com/v3/3.1/mapsjs-service.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://js.api.here.com/v3/3.1/mapsjs-marker.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://js.api.here.com/v3/3.1/mapsjs-mapevents.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://js.api.here.com/v3/3.1/mapsjs-ui.js" type="text/javascript" charset="utf-8"></script>
</head>
<body class="distance-bg">
    <nav class="distance-header">
        <div class="logo">
            <h2><span class="material-icons">login</span> AI-Based Bus Fare Calculation</h2>
        </div>
        <ul class="nav-links">
            <li><a href="{{ url_for('home') }}"><span class="material-icons">home</span> Home</a></li>
            <li><a href="{{ url_for('signup') }}"><span class="material-icons">person_add</span> Sign Up</a></li>
        </ul>
    </nav>
    <div class="glass-card login-max-width login-container">
        <h2><span class="material-icons">login</span> Login to Your Account</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button id="login-btn" class="modern-btn" onclick="window.location.href='{{url_for('fd')}}'"><span class="material-icons">login</span> Login</button>
        <div class="link">
            <p>Don't have an account? <a href="{{ url_for('signup') }}"><span class="material-icons">person_add</span> Sign Up</a></p>
        </div>
    </div>
</body>
</html>

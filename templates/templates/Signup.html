<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - AI Bus Fare Calculation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="distance-bg">
    <nav class="distance-header">
        <div class="logo">
            <h2><span class="material-icons">person_add</span> AI-Based Bus Fare Calculation</h2>
        </div>
        <ul class="nav-links">
            <li><a href="{{url_for('home')}}"><span class="material-icons">home</span> Home</a></li>
            <li><a href="{{url_for('login')}}"><span class="material-icons">login</span> Login</a></li>
        </ul>
    </nav>
    <section class="glass-card signup-max-width">
        <h2><span class="material-icons">person_add</span> Sign Up</h2>
        <form>
            <input type="text" id="username" placeholder="Username" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="modern-btn" onclick="window.location.href='{{url_for('login')}}'"><span class="material-icons">person</span> Sign Up</button>
        </form>
        <p>Already have an account? <a href="{{url_for('login')}}"><span class="material-icons">login</span> Login here</a></p>
    </section>
</body>
</html>

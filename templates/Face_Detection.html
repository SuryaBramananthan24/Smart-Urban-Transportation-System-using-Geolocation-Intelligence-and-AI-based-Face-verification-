<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Detection - AI Bus Fare Calculation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #002C54;
            color: white;
            font-size: 16px;
            line-height: 1.5;
        }

        header {
            background-color: #C5001A;
            padding: 10px 0;
            color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        header .navbar {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        header .navbar a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 10px 15px;
            transition: background-color 0.3s ease;
        }

        header .navbar a:hover {
            background-color: #a00014;
            border-radius: 5px;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            color: #002C54;
        }

        main h1 {
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
            color: #002C54;
        }

        #startFaceDetection {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #C5001A;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
        }

        #startFaceDetection:hover {
            background-color: #001931;
        }

        .captured-face-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 20px;
        }

        .captured-face-container img {
            max-width: 200px;
            border-radius: 10px;
        }

        .captured-face-container p {
            font-size: 16px;
            margin-top: 10px;
        }

        #faceComparisonResult {
            margin-top: 20px;
            font-size: 18px;
            color: #C5001A;
            font-weight: bold;
        }

        #backbtn {
            background-color:#C5001A;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            padding: 20px;
            width: 50%;
            transition: background-color 0.3s ease;
        }

        #backbtn:hover {
            background-color: #001931;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .captured-face-container {
                flex-direction: column;
                align-items: center;
            }

            .captured-face-container img {
                max-width: 100%;
            }
        }
    </style>
</head>
<body class="distance-bg">
    <header class="distance-header">
        <div class="navbar">
            <a href="{{ url_for('home') }}"><span class="material-icons">home</span> Home</a>
        </div>
    </header>
    <main class="glass-card">
        <h1><span class="material-icons">face</span> Face Detection</h1>
        <button id="startFaceDetection" class="modern-btn"><span class="material-icons">camera_alt</span> Start Face Detection</button>
        <div id="capturedFaceContainer" class="captured-face-container">
            <div>
                <img id="capturedFace1" src="" alt="Captured Face 1">
                <p id="location1"></p>
                <p id="timestamp1"></p>
            </div>
            <div>
                <img id="capturedFace2" src="" alt="Captured Face 2">
                <p id="location2"></p>
                <p id="timestamp2"></p>
            </div>
        </div>
        <p id="faceComparisonResult" class="modern-fare"></p>
    </main>
    <center><button id="backbtn" class="modern-btn" onclick="window.location.href='{{ url_for('dm') }}'"><span class="material-icons">arrow_forward</span> Next</button></center>

    <script>
    $(document).ready(function () {
        $('#startFaceDetection').click(function () {
            $('#faceComparisonResult').text("");

            if ($('#startFaceDetection').text() === "Restart Detection") {
                $.post('/reset_face_detection', function (response) {
                    $('#faceComparisonResult').text("Reset successful. Click again to start detection.");
                    $('#capturedFace1').attr('src', "");
                    $('#capturedFace2').attr('src', "");
                    $('#location1').text("");
                    $('#timestamp1').text("");
                    $('#location2').text("");
                    $('#timestamp2').text("");
                    $('#startFaceDetection').text("Start Face Detection");
                }).fail(function () {
                    $('#faceComparisonResult').text("Failed to reset face detection.");
                });
                return;
            }

            // Use browser geolocation
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    $.ajax({
                        url: '/start_face_detection',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude
                        }),
                        success: function (response) {
                            if (response.error) {
                                $('#faceComparisonResult').text(response.error);
                            } else {
                                if (response.image) {
                                    $('#capturedFace1').attr('src', "data:image/jpeg;base64," + response.image);
                                    $('#location1').text('Location: ' + response.location);
                                    $('#timestamp1').text('Timestamp: ' + response.timestamp);
                                    localStorage.setItem('place1', response.location);
                                    localStorage.setItem('coords1', response.latlng.join(','));
                                } else {
                                    $('#capturedFace2').attr('src', "data:image/jpeg;base64," + response.image2);
                                    $('#location2').text('Location: ' + response.location2);
                                    $('#timestamp2').text('Timestamp: ' + response.timestamp2);
                                    localStorage.setItem('place2', response.location2);
                                    localStorage.setItem('coords2', response.latlng2.join(','));
                                }
                                if (response.hide_button) {
                                    $('#startFaceDetection').text("Restart Detection");
                                    $('#faceComparisonResult').text(response.result);
                                }
                            }
                        },
                        error: function (xhr, status, error) {
                            $('#faceComparisonResult').text("Error: " + error);
                        }
                    });
                }, function(error) {
                    $('#faceComparisonResult').text("Geolocation error: " + error.message);
                });
            } else {
                $('#faceComparisonResult').text("Geolocation is not supported by this browser.");
            }
        });
    });
    </script>
</body>
</html>
